# ==============================================================================
# Project 5A: Sistem Otomasi Backup dan Pemulihan Data Linux
# Shared Configuration File (Secret-Free)
# Owner: Member 1 (Input & Source Validation)
# ==============================================================================
# Every path can be overridden via environment variables or CLI flags for
# safe testing on the Linux VM without editing this file.

# Base runtime directory on Linux VM (created by scripts/setup_env.sh)
PROJECT_BASE_DIR="${PROJECT_BASE_DIR:-/var/lib/os5a-backup}"

# Core operational directories
SOURCE_DIR="${SOURCE_DIR:-${PROJECT_BASE_DIR}/source}"
BACKUP_DIR="${BACKUP_DIR:-${PROJECT_BASE_DIR}/backups}"
RESTORE_DIR="${RESTORE_DIR:-${PROJECT_BASE_DIR}/restore_test}"
LOG_DIR="${LOG_DIR:-${PROJECT_BASE_DIR}/logs}"
OUTPUT_DIR="${OUTPUT_DIR:-${PROJECT_BASE_DIR}/output}"
LOCK_DIR="${LOCK_DIR:-${PROJECT_BASE_DIR}/locks}"

# Runtime file paths
LOCK_FILE="${LOCK_FILE:-${LOCK_DIR}/backup.lock}"
LOG_FILE="${LOG_FILE:-${LOG_DIR}/backup.log}"
REPORT_FILE="${REPORT_FILE:-${OUTPUT_DIR}/laporan.txt}"

# Archive naming convention: backup_YYYYMMDD_HHMMSS.tar.gz
ARCHIVE_PREFIX="${ARCHIVE_PREFIX:-backup}"
ARCHIVE_EXT="${ARCHIVE_EXT:-.tar.gz}"
TIMESTAMP_FORMAT="${TIMESTAMP_FORMAT:-%Y%m%d_%H%M%S}"

# Least-privilege ownership & permission policy (non-root execution)
BACKUP_GROUP="${BACKUP_GROUP:-backupgrp}"
BACKUP_USER="${BACKUP_USER:-backupops}"
DIR_MODE="${DIR_MODE:-750}"
OUTPUT_DIR_MODE="${OUTPUT_DIR_MODE:-755}"
ARCHIVE_MODE="${ARCHIVE_MODE:-640}"

# ==============================================================================
# Standardized Exit Codes (Members 1–5)
# ==============================================================================
EXIT_OK=0             # Success
EXIT_ERR_GENERAL=1    # General error / Docker read-only write failure
EXIT_ERR_SOURCE=2     # Member 1: Invalid parameter, missing/unreadable/empty source
EXIT_ERR_ARCHIVE=3    # Member 2: Archive creation or destination write failure
EXIT_ERR_VERIFY=4     # Member 3: Checksum generation or integrity mismatch failure
EXIT_ERR_RESTORE=5    # Member 4: Restore rejected (corrupted/invalid archive)
EXIT_ERR_LOCK=6       # Member 5: Concurrent backup blocked by flock
